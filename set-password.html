<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALA OS — Set Password</title>
<style>
html,body{margin:0;padding:0;height:100%;font-family:Calibri,'Helvetica Neue',Arial,sans-serif;background:#1A2B4A}
body{display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:10px;padding:34px 38px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.4);text-align:center;box-sizing:border-box}
.card h1{font-family:Georgia,serif;color:#1A2B4A;font-size:19px;margin:0 0 2px}
.gold{color:#C9A84C;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:#555;margin:14px 0 5px;text-align:left}
input{width:100%;box-sizing:border-box;padding:10px;font-size:14px;border:1px solid #c9d0dc;border-radius:6px}
input:focus{outline:2px solid #C9A84C;outline-offset:1px}
.showpw{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:#555;text-align:left}
.showpw input{width:auto}
.hint{font-size:11.5px;color:#999;margin-top:4px;text-align:left}
button.go{width:100%;padding:10px;background:#1A2B4A;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:18px}
button.go:hover{opacity:.92}
button.go:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;font-size:12.5px;padding:9px 11px;border-radius:6px;display:none;text-align:left}
.msg.err{display:block;background:#fdecea;color:#8a1c1c;border:1px solid #f3c6c2}
.msg.ok{display:block;background:#eafaf1;color:#145a32;border:1px solid #82e0aa}
.msg.info{display:block;background:#fff8e6;color:#7a5000;border:1px solid #e0c060}
</style>
</head>
<body>
<div class="card">
<h1>Alexander LaVecchia Architect</h1><div class="gold">ALA OS</div>
<div style="font-size:13px;color:#555">Choose a password for your account. Only you will know it.</div>
<form id="pwForm">
<label for="pw1">New password</label>
<input id="pw1" type="password" autocomplete="new-password" required minlength="8">
<div class="hint">At least 8 characters.</div>
<label for="pw2">Confirm password</label>
<input id="pw2" type="password" autocomplete="new-password" required minlength="8">
<label class="showpw"><input type="checkbox" id="showPw"> Show passwords</label>
<button id="submitBtn" class="go" type="submit">Save password</button>
</form>
<div id="msg" class="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPA_URL = "https://sthsbygormkxpnhljdsb.supabase.co", SUPA_ANON = "sb_publishable_OCNrCmVCMt9vTa3ZDTUD8A_aEbgRZAR";
  var msg = document.getElementById("msg");
  var form = document.getElementById("pwForm");
  var btn = document.getElementById("submitBtn");

  function show(text, cls) { msg.className = "msg " + cls; msg.textContent = text; }

  var showPw = document.getElementById("showPw");
  showPw.addEventListener("change", function () {
    var t = showPw.checked ? "text" : "password";
    document.getElementById("pw1").type = t;
    document.getElementById("pw2").type = t;
  });

  if (!SUPA_URL || !SUPA_ANON) {
    form.style.display = "none";
    show("This workspace isn't connected yet.", "info");
    return;
  }

  var client = supabase.createClient(SUPA_URL, SUPA_ANON, {
    auth: { detectSessionInUrl: true, flowType: "implicit" }
  });

  // The invite/recovery link lands here carrying a token. supabase-js picks it up
  // automatically and establishes a temporary session; that session is what lets
  // updateUser() below set the password. If there's no token (someone just
  // navigated here directly), say so plainly instead of failing cryptically.
  client.auth.getSession().then(function (r) {
    if (!r.data.session) {
      setTimeout(function () {
        client.auth.getSession().then(function (r2) {
          if (!r2.data.session) {
            form.style.display = "none";
            show("This link has expired or was already used. Ask Mike for a fresh invite link.", "err");
          }
        });
      }, 1200);
    }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var p1 = document.getElementById("pw1").value;
    var p2 = document.getElementById("pw2").value;
    if (p1 !== p2) { show("The two passwords don't match.", "err"); return; }
    btn.disabled = true;
    show("Saving…", "info");
    client.auth.updateUser({ password: p1 }).then(function (r) {
      if (r.error) {
        show("Couldn't save: " + r.error.message, "err");
        btn.disabled = false;
        return;
      }
      show("Password saved. Taking you to ALA OS…", "ok");
      setTimeout(function () { window.location.href = "index.html"; }, 1200);
    });
  });
})();
</script>
</body>
</html>
