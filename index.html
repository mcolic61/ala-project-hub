<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALA OS</title>
<style>
html,body { margin:0; padding:0; height:100%; font-family:Calibri,'Helvetica Neue',Arial,sans-serif; background:#1A2B4A; }
#gate { display:flex; align-items:center; justify-content:center; height:100%; }
.card { background:#fff; border-radius:10px; padding:34px 38px; width:340px; box-shadow:0 8px 40px rgba(0,0,0,.4); text-align:center; }
.card h1 { font-family:Georgia,serif; color:#1A2B4A; font-size:19px; margin:0 0 2px; }
.card .gold { color:#C9A84C; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:20px; }
.card input { width:100%; box-sizing:border-box; padding:10px; font-size:14px; border:1px solid #c9d0dc; border-radius:6px; margin:14px 0 6px; text-align:center; }
.card button.go { width:100%; padding:10px; background:#1A2B4A; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; }
.card .err { color:#c0392b; font-size:12px; min-height:16px; }
.card .err.info { color:#8a6d1f; }
.link-btn { width:auto; display:block; margin:12px auto 0; padding:6px; background:none; color:#1A2B4A; font-size:12px; font-weight:600; text-decoration:underline; cursor:pointer; border:none; }
.link-btn:hover { opacity:.75; }
.small { font-size:10.5px; color:#999; margin-top:14px; }
#frame { display:none; width:100%; height:100%; border:none; }
</style></head><body>
<div id="gate"><div class="card">
<h1>Alexander LaVecchia Architect</h1><div class="gold">ALA OS</div>
<div id="stage-pass">
<div style="font-size:12.5px;color:#555">Enter the shared team passphrase</div>
<input type="password" id="pw" placeholder="Team passphrase" onkeydown="if(event.key==='Enter')unlock()">
<label style="display:block;text-align:left;font-size:12px;color:#555;margin:2px 2px 0;cursor:pointer"><input type="checkbox" onchange="document.getElementById('pw').type=this.checked?'text':'password'" style="vertical-align:middle;margin-right:5px">Show password</label>
<div class="err" id="err1"></div>
<button class="go" onclick="unlock()">Continue</button>
</div>
<div id="stage-signin" style="display:none">
<div style="font-size:12.5px;color:#555">Sign in with your ALA OS account</div>
<input type="email" id="email" placeholder="Email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
<input type="password" id="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
<label style="display:block;text-align:left;font-size:12px;color:#555;margin:2px 2px 0;cursor:pointer"><input type="checkbox" onchange="document.getElementById('password').type=this.checked?'text':'password'" style="vertical-align:middle;margin-right:5px">Show password</label>
<div class="err" id="err2"></div>
<button class="go" onclick="signIn()">Sign In</button>
<button type="button" class="link-btn" onclick="forgotPw()">Forgot password?</button>
</div>
<div id="stage-mfa" style="display:none">
<div style="font-size:12.5px;color:#555" id="mfaSub">Enter the 6-digit code from your authenticator app.</div>
<div id="mfaQr" style="text-align:center;margin:6px 0"></div>
<div id="mfaSecret" style="display:none;font-size:11px;color:#8a6d1f;word-break:break-all;margin:4px 0"></div>
<input type="text" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" onkeydown="if(event.key==='Enter')mfaVerify()">
<div class="err" id="err3"></div>
<button class="go" onclick="mfaVerify()">Verify</button>
<button type="button" class="link-btn" id="mfaSkipBtn" style="display:none" onclick="mfaSkip()">Skip for now</button>
<button type="button" class="link-btn" id="mfaLostBtn" style="display:none" onclick="mfaLost()">Lost your authenticator?</button>
</div>
<div class="small">The shared team <b>passphrase</b> unlocks the encrypted page; your own <b>password</b> then signs you in.<br>Your sign-in is remembered on this device.</div>
</div></div>

var MEM={};
function stGet(k){try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;}}
function stSet(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
function stDel(k){try{localStorage.removeItem(k);}catch(e){delete MEM[k];}}

function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function decrypt(pass){var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITERS,hash:"SHA-256"},km,256);var key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));return new TextDecoder().decode(pt);}

async function afterUnlock(){
if(!sbClient){document.getElementById("err1").textContent="Sign-in isn't configured yet — ask Mike.";return;}

if(s.data.session){await afterPasswordAuth(s.data.session);return;}
document.getElementById("stage-pass").style.display="none";
document.getElementById("stage-signin").style.display="block";
// Remember the email (not the password -- that stays with the browser's own
// password manager) so a returning sign-in only needs the password retyped.
var rememberedEmail=stGet("mmb_email");
if(rememberedEmail)document.getElementById("email").value=rememberedEmail;
document.getElementById(rememberedEmail?"password":"email").focus();}
async function signIn(){var email=document.getElementById("email").value.trim();var password=document.getElementById("password").value;var err=document.getElementById("err2");err.className="err";err.textContent="";
if(!email||!password){err.textContent="Enter your email and password.";return;}
stSet("mmb_email",email);

if(r.error){err.textContent="Sign-in failed — check your email and password.";return;}

// 2026-07-23: two-factor gate, inserted between a valid password and the iframe load.
// Mirrors ALA COFO's cofoGate() pattern -- forced for the admin (Mike), optional/skippable

var mfaFactorId=null, mfaPendingSession=null;
async function afterPasswordAuth(session){
var aal;
try{aal=(await sbClient.auth.mfa.getAuthenticatorAssuranceLevel()).data;}
catch(e){await afterSignIn(session);return;}
if(!aal||aal.currentLevel==="aal2"){await afterSignIn(session);return;}
if(aal.nextLevel==="aal2"){await mfaShowChallenge(session);return;}
var email=(session.user&&session.user.email||"").toLowerCase();
if(ADMIN_EMAIL&&email===ADMIN_EMAIL.toLowerCase()){await mfaShowEnroll(session);return;}
await afterSignIn(session);}
function mfaGoto(){document.getElementById("stage-signin").style.display="none";document.getElementById("stage-mfa").style.display="block";}
async function mfaShowChallenge(session){
mfaPendingSession=session;mfaGoto();
document.getElementById("mfaSub").textContent="Enter the 6-digit code from your authenticator app.";
document.getElementById("mfaQr").innerHTML="";document.getElementById("mfaSecret").style.display="none";
document.getElementById("mfaSkipBtn").style.display="none";document.getElementById("mfaLostBtn").style.display="";
document.getElementById("mfaCode").value="";document.getElementById("err3").textContent="";
try{

if(!f){await mfaShowEnroll(session);return;}

}catch(e){document.getElementById("err3").textContent="Couldn't start verification — reload and try again.";return;}
document.getElementById("mfaCode").focus();}
async function mfaShowEnroll(session){
mfaPendingSession=session;mfaGoto();
document.getElementById("mfaSub").textContent="Set up two-factor: scan this with an authenticator app (Google Authenticator, Authy, 1Password), then enter the 6-digit code it shows.";
document.getElementById("mfaSkipBtn").style.display="";document.getElementById("mfaLostBtn").style.display="none";
document.getElementById("mfaCode").value="";document.getElementById("err3").textContent="";
try{
var list=(await sbClient.auth.mfa.listFactors()).data;
var all=(list&&list.all)||[];
for(var i=0;i<all.length;i++){if(all[i].factor_type==="totp"&&all[i].status==="unverified"){await sbClient.auth.mfa.unenroll({factorId:all[i].id}).catch(function(){});}}
var er=await sbClient.auth.mfa.enroll({factorType:"totp"});
if(er.error){document.getElementById("err3").textContent="Couldn't start setup: "+er.error.message;return;}
mfaFactorId=er.data.id;
document.getElementById("mfaQr").innerHTML='<img alt="Authenticator QR code" style="width:170px;height:170px" src="'+er.data.totp.qr_code+'">';
var sec=document.getElementById("mfaSecret");sec.style.display="";sec.textContent="Can't scan? Enter this key manually: "+er.data.totp.secret;
}catch(e){document.getElementById("err3").textContent="Couldn't start setup — reload and try again.";return;}
document.getElementById("mfaCode").focus();}
async function mfaVerify(){
var code=(document.getElementById("mfaCode").value||"").trim();var err=document.getElementById("err3");
if(!/^\d{6}$/.test(code)){err.textContent="Enter the 6-digit code from your app.";return;}
if(!mfaFactorId){err.textContent="Something went wrong — reload and try again.";return;}
err.textContent="";
try{
var ch=await sbClient.auth.mfa.challenge({factorId:mfaFactorId});
if(ch.error){err.textContent=ch.error.message;return;}
var ve=await sbClient.auth.mfa.verify({factorId:mfaFactorId,challengeId:ch.data.id,code:code});
if(ve.error){err.textContent="That code didn't match — use the current code from your app.";return;}
var s=(await sbClient.auth.getSession()).data.session;
await afterSignIn(s);
}catch(e){err.textContent="Verification failed — try again.";}}

window.addEventListener("message",function(m){if(!m.data)return;
if(m.data.mmb==="sign-out"){signOutAndReload();}
if(m.data.mmb==="new-version"){var last=+(stGet("mmb_lastreload")||0),now=Date.now();if(now-last<90000)return;stSet("mmb_lastreload",String(now));location.replace(location.pathname+"?v="+encodeURIComponent(m.data.id||now));}});
(function(){
// Personal-link convenience: https://.../#p=<passphrase> pre-fills the passphrase (the
// fragment never reaches the server). NEVER put the real passphrase value in this comment
// or anywhere else in this unencrypted outer shell -- it ships to the public internet
// verbatim (the exact disclosure bug found and fixed 2026-07-23; see check_alaos_security.py
// invariant #7). Identity is no longer carried in the URL at all -- signing in with a real
// account is the only way to establish who's asking now.
try{var h=location.hash.replace(/^#/,"");if(h){var q={};h.split("&").forEach(function(kv){var m=kv.split("=");if(m.length===2)q[m[0]]=decodeURIComponent(m[1]);});
if(q.p){document.getElementById("pw").value=q.p;try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}}}catch(e){}
var p=stGet("mmb_pass");if(p){document.getElementById("pw").value=p;unlock();}})();
// Service worker: forces the page HTML to be fetched from the network every load, so a
// stale cached copy can never be served again. Registered once; permanent thereafter.
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script></body></html>
