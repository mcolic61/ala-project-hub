function stDel(k){try{localStorage.removeItem(k);}catch(e){delete MEM[k];}}
window.onerror=function(msg){try{document.getElementById("err").textContent="Page script hit a snag ("+msg+") — reload, or use your personal link.";}catch(e){} return false;};
try{SEL=stGet("mmb_user")||"";}catch(e){}
var whoEl=document.getElementById("who");
function pick(el){SEL=el.textContent.trim();stSet("mmb_user",SEL);paint();document.getElementById("err").textContent="";}
function paint(){try{Array.prototype.forEach.call(whoEl.children,function(b){b.className=b.textContent.trim()===SEL?"on":"";});}catch(e){}}
paint();
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function decrypt(pass){var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITERS,hash:"SHA-256"},km,256);var key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));return new TextDecoder().decode(pt);}
async function go(){var pass=document.getElementById("pw").value.trim();var err=document.getElementById("err");if(!SEL){err.textContent="Pick your name first.";return;}if(!pass){err.textContent="Enter the team passphrase.";return;}err.textContent="";
try{var html=await decrypt(pass);stSet("mmb_pass",pass);stSet("mmb_user",SEL);
var pinok=stGet("mmb_pinok_"+SEL)==="1";
var inject="<script>window.MMB_USER="+JSON.stringify(SEL)+";window.MMB_PINOK="+(pinok?"true":"false")+";<\/script>";
var f=document.getElementById("frame");f.srcdoc=inject+html;document.getElementById("gate").style.display="none";f.style.display="block";}
catch(e){err.textContent="That passphrase didn't work.";stDel("mmb_pass");}}
window.addEventListener("message",function(m){if(!m.data)return;
if(m.data.mmb==="switch-user"){stDel("mmb_user");location.reload();}
if(m.data.mmb==="set-user"&&PEOPLE.indexOf(m.data.user)>=0){stSet("mmb_user",m.data.user);location.reload();}
if(m.data.mmb==="pin-ok"&&m.data.user){stSet("mmb_pinok_"+m.data.user,"1");}
if(m.data.mmb==="new-version"){var last=+(stGet("mmb_lastreload")||0),now=Date.now();if(now-last<90000)return;stSet("mmb_lastreload",String(now));location.replace(location.pathname+"?v="+encodeURIComponent(m.data.id||now));}});
(function(){
// Personal auto-login link support: https://.../#u=Mike&p=ALA2026 (fragment never reaches the server)
try{var h=location.hash.replace(/^#/,"");if(h){var q={};h.split("&").forEach(function(kv){var m=kv.split("=");if(m.length===2)q[m[0]]=decodeURIComponent(m[1]);});
if(q.u&&PEOPLE.indexOf(q.u)>=0){SEL=q.u;paint();}
if(q.p){document.getElementById("pw").value=q.p;}
if(q.u||q.p){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}if(SEL&&document.getElementById("pw").value){go();return;}}}}catch(e){}
var p=stGet("mmb_pass");if(p&&SEL){document.getElementById("pw").value=p;go();}})();
// Service worker: forces the page HTML to be fetched from the network every load, so a
// stale cached copy can never be served again. Registered once; permanent thereafter.
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script></body></html>
