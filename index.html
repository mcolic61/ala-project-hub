if(s.data.session){await afterSignIn(s.data.session);return;}
document.getElementById("stage-pass").style.display="none";
document.getElementById("stage-signin").style.display="block";
// Remember the email (not the password -- that stays with the browser's own
// password manager) so a returning sign-in only needs the password retyped.
var rememberedEmail=stGet("mmb_email");
if(rememberedEmail)document.getElementById("email").value=rememberedEmail;
document.getElementById(rememberedEmail?"password":"email").focus();}
async function signIn(){var email=document.getElementById("email").value.trim();var password=document.getElementById("password").value;var err=document.getElementById("err2");err.className="err";err.textContent="";
if(!email||!password){err.textContent="Enter your email and password.";return;}
stSet("mmb_email",email);
var r=await sbClient.auth.signInWithPassword({email:email,password:password});
if(r.error){err.textContent="Sign-in failed — check your email and password.";return;}
await afterSignIn(r.data.session);}
async function forgotPw(){var email=document.getElementById("email").value.trim();var err=document.getElementById("err2");
if(!email){err.className="err";err.textContent="Type your email above first, then tap Forgot password.";return;}
err.className="err info";err.textContent="Sending reset link…";
var r=await sbClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/set-password.html"});
if(r.error){err.className="err";err.textContent="Couldn't send the reset email: "+r.error.message;return;}
err.className="err info";err.textContent="Check your email for a reset link.";}
async function afterSignIn(session){
var err=document.getElementById("err2")||document.getElementById("err1");
var token=session.access_token;
var r;try{r=await fetch("https://ala-harvest-proxy.vercel.app/api/whoami",{headers:{"Authorization":"Bearer "+token}});}catch(e){if(err){err.className="err";err.textContent="Can't reach the sync service — try again in a moment.";}return;}
var d=r.ok?await r.json():{name:null};
if(!d.name||PEOPLE.indexOf(d.name)<0){
document.getElementById("gate").innerHTML="<div class='card'><h1>Alexander LaVecchia Architect</h1><div class='gold'>ALA OS</div><div style='font-size:13px;color:#555;margin:10px 0'>This account isn't set up for ALA OS yet — ask Mike to add you.</div><button class='go' onclick='signOutAndReload()'>Try a different account</button></div>";
return;}
var inject="<script>window.MMB_USER="+JSON.stringify(d.name)+";window.MMB_TOKEN="+JSON.stringify(token)+";<\/script>";
var f=document.getElementById("frame");f.srcdoc=inject+DECRYPTED_HTML;document.getElementById("gate").style.display="none";f.style.display="block";
sbClient.auth.onAuthStateChange(function(event,newSession){if(newSession&&newSession.access_token){try{f.contentWindow.postMessage({mmb:"token-refresh",token:newSession.access_token},"*");}catch(e){}}});}
function signOutAndReload(){if(sbClient)sbClient.auth.signOut();location.reload();}
window.addEventListener("message",function(m){if(!m.data)return;
if(m.data.mmb==="sign-out"){signOutAndReload();}
if(m.data.mmb==="new-version"){var last=+(stGet("mmb_lastreload")||0),now=Date.now();if(now-last<90000)return;stSet("mmb_lastreload",String(now));location.replace(location.pathname+"?v="+encodeURIComponent(m.data.id||now));}});
(function(){
// Personal-link convenience: https://.../#p=ALA2026 pre-fills the passphrase (fragment
// never reaches the server). Identity is no longer carried in the URL at all -- signing
// in with a real account is the only way to establish who's asking now.
try{var h=location.hash.replace(/^#/,"");if(h){var q={};h.split("&").forEach(function(kv){var m=kv.split("=");if(m.length===2)q[m[0]]=decodeURIComponent(m[1]);});
if(q.p){document.getElementById("pw").value=q.p;try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}}}catch(e){}
var p=stGet("mmb_pass");if(p){document.getElementById("pw").value=p;unlock();}})();
// Service worker: forces the page HTML to be fetched from the network every load, so a
// stale cached copy can never be served again. Registered once; permanent thereafter.
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script></body></html>
